name: Latest Home Assistant compatibility

on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test against latest Home Assistant
        run: |
          # No version pins here: install the latest test tooling and let
          # pytest-homeassistant-custom-component pull the newest Home Assistant
          # it supports. This keeps the resolver happy (a pinned mypy clashed
          # with phcc's mypy-dev, and a forced homeassistant== constraint fought
          # phcc's own pin) and needs no bumping on every HA release. mypy is
          # covered by the pinned-toolchain quality job, so it's omitted here.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/home-assistant/home-assistant:stable \
            bash -ceu '
              python -m venv --system-site-packages /tmp/toss-invest-test
              /tmp/toss-invest-test/bin/python -m pip install --upgrade \
                pytest pytest-asyncio pytest-homeassistant-custom-component \
                aioresponses ruff
              /tmp/toss-invest-test/bin/python -c "import importlib.metadata as m; print(\"Home Assistant:\", m.version(\"homeassistant\"))"
              /tmp/toss-invest-test/bin/pytest -q
              /tmp/toss-invest-test/bin/ruff check .
              /tmp/toss-invest-test/bin/ruff format --check .
            '
